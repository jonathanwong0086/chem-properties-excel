name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check tag matches SKILL.md version
        run: |
          skill_version=$(grep -m1 -E '^\s*version:' SKILL.md | sed -E 's/.*"([^"]+)".*/\1/')
          if [ "v${skill_version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match SKILL.md version ${skill_version}"
            exit 1
          fi

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists, skipping."
            exit 0
          fi
          python tools/extract_release_notes.py "$GITHUB_REF_NAME" > notes.md
          gh release create "$GITHUB_REF_NAME" \
            --title "chem-properties-excel $GITHUB_REF_NAME" \
            --notes-file notes.md \
            --verify-tag
